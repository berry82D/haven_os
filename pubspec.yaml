name: haven_os
description: "Haven OS - Family CFO & Farm Manager"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  image_picker: ^1.0.0
  google_mlkit_text_recognition: ^0.13.1
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.0.0
  fl_chart: ^0.69.0
  path_provider: ^2.1.4
  crypto: ^3.0.3
  file_picker: ^11.0.3
  http: ^1.0.0
  firebase_core: ^3.9.0
  cloud_firestore: ^5.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/icons/
    - assets/fonts/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/haven_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/haven_icon.png"
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
