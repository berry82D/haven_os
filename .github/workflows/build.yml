name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Restore debug keystore (must match local builds)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep "SHA256:" | tr -d ': ' | tr 'A-Z' 'a-z')
          echo "Restored key fingerprint: $FP"
          echo "$FP" | grep -q "387faa5178e938201b4dae11514db74d22febaafe3d5667a32aedeb3e3554624"

      - name: Extract version and short SHA
        id: vars
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Artifact will be: haven_os-${VERSION}-b${{ github.run_number }}-${SHA}.apk"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify APK is signed with the expected key
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          grep -q "387faa5178e938201b4dae11514db74d22febaafe3d5667a32aedeb3e3554624" /tmp/certs.txt

      - name: Rename APK with version + SHA
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk haven_os-${{ steps.vars.outputs.version }}-b${{ steps.vars.outputs.run }}-${{ steps.vars.outputs.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haven_os-${{ steps.vars.outputs.version }}-b${{ steps.vars.outputs.run }}-${{ steps.vars.outputs.sha }}
          path: build/app/outputs/flutter-apk/haven_os-${{ steps.vars.outputs.version }}-b${{ steps.vars.outputs.run }}-${{ steps.vars.outputs.sha }}.apk
          retention-days: 30